services:
  - type: web
    name: glowy-store
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
